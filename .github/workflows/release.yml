---
name: "tagged-release"
permissions:
  contents: write

on:
  push:
    tags:
      - v*

jobs:
  tagged-release:
    name: "Tagged Release"
    runs-on: "ubuntu-latest"    
    
    steps:    
      - name: Checkout
        uses: actions/checkout@v3
            
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test
        run: node --test tests/*.test.mjs

      - name: Build browser packages
        run: |
          python3 tools/build.py
          cp build/aria2e-chromium-*.zip build/extension.zip
      
      - name: Validate Firefox package
        run: npx --yes web-ext@10.8.0 lint --source-dir build/firefox

      - name: Crx
        uses: "cardinalby/webext-buildtools-chrome-crx-action@v2"
        with:
          zipFilePath: "build/extension.zip"
          crxFilePath: "build/aria2e-${{ github.ref_name }}.crx"
          privateKey: ${{ secrets.CHROME_CRX_PRIVATE_KEY }}

      - name: Release
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: false
          files: |
            build/aria2e-${{ github.ref_name }}.crx
            build/aria2e-chromium-*.zip
            build/aria2e-firefox-*.zip
